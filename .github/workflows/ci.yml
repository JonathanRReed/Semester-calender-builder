name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (oxlint)
        run: bun run lint:oxc

      - name: Lint (eslint)
        run: bun run lint

      - name: Bun checker regression tests
        run: bun run test:bun-check

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck (TypeScript)
        run: bun run typecheck:tsc

      - name: Unit tests (export + parse)
        run: bun run test

      - name: Build
        run: bun run build
